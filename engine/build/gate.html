<!doctype html>
<html lang="vi"><head>__HEAD__
<meta name="robots" content="noindex,nofollow">
<style>
.gate{min-height:100dvh;display:grid;place-items:center;padding:24px 16px;background:radial-gradient(900px 500px at 85% 0%,rgba(226,113,29,.28),transparent 70%),radial-gradient(900px 600px at 0% 100%,rgba(31,127,121,.35),transparent 70%),linear-gradient(160deg,#0c1f3a,#12305a 60%,#0d2340);font-family:var(--font)}
.gate-card{width:min(440px,100%);background:#fff;border-radius:24px;padding:34px 30px 28px;box-shadow:0 30px 80px rgba(0,0,0,.35);color:#1e2833}
.gate-brand{display:flex;align-items:center;gap:12px;margin-bottom:22px}
.gate-brand span{display:grid;place-items:center;width:44px;height:44px;border-radius:13px;background:linear-gradient(135deg,#12305a,#1f4c86);color:#fff;font-weight:800}
.gate-brand b{display:block;font-size:18px;color:#12305a;letter-spacing:-.01em}
.gate-brand small{display:block;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#66727d}
.gate h1{margin:0 0 8px;font-size:24px;line-height:1.25;letter-spacing:-.02em;color:#12305a}
.gate p.sub{margin:0 0 22px;font-size:14.5px;line-height:1.6;color:#4a5763}
.gate label{display:block;font-size:13px;font-weight:700;margin:0 0 8px;color:#3a4754}
.gate .field{position:relative}
.gate input[type=password],.gate input[type=text]{width:100%;height:52px;padding:0 54px 0 16px;border-radius:14px;border:1.5px solid #d4d9de;font-size:17px;font-family:var(--font);outline:none;transition:border-color .15s,box-shadow .15s;background:#fbfbfa}
.gate input:focus{border-color:#1f7f79;box-shadow:0 0 0 4px rgba(31,127,121,.15);background:#fff}
.gate .eye{position:absolute;right:8px;top:8px;height:36px;width:40px;border:0;border-radius:10px;background:transparent;font-size:17px;color:#66727d;cursor:pointer}
.gate .remember{display:flex;align-items:center;gap:9px;margin:14px 0 18px;font-size:14px;color:#4a5763;font-weight:500}
.gate .remember input{width:18px;height:18px;accent-color:#1f7f79}
.gate button.go{width:100%;height:52px;border:0;border-radius:14px;background:#12305a;color:#fff;font-size:16px;font-weight:800;font-family:var(--font);cursor:pointer;box-shadow:0 10px 24px rgba(18,48,90,.3)}
.gate button.go:hover{background:#1f4c86}
.gate button.go[disabled]{opacity:.7;cursor:progress}
.gate .err{min-height:22px;margin:10px 0 0;font-size:14px;font-weight:600;color:#b93a1e}
.gate .help{margin:18px 0 0;padding-top:16px;border-top:1px solid #e2e5e8;font-size:13px;line-height:1.6;color:#66727d}
.gate .shake{animation:shake .35s}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
</style>
</head>
<body data-book="__TITLE__" data-storage="__STORE__">
<main class="gate" id="gate">
<form class="gate-card" id="gateForm" autocomplete="on">
<div class="gate-brand"><span>__BRAND__</span><div><b>__TITLE__</b><small>Ebook khoá e-learning</small></div></div>
<h1>Dành cho học viên khoá học</h1>
<p class="sub">__SUB__. Nhập mật khẩu được cấp trong khoá e-learning để mở ebook.</p>
<label for="pw">Mật khẩu</label>
<div class="field"><input id="pw" name="password" type="password" autocomplete="current-password" required autofocus placeholder="Nhập mật khẩu"><button class="eye" id="eye" type="button" aria-label="Hiện mật khẩu">👁</button></div>
<label class="remember"><input type="checkbox" id="remember" checked> Ghi nhớ trên thiết bị này</label>
<button class="go" id="go" type="submit">Mở ebook →</button>
<div class="err" id="err" role="alert"></div>
<div class="help">__HELP__</div>
</form>
</main>
<script id="payload" type="application/json">__PAYLOAD__</script>
<script>
(() => {
  const P = JSON.parse(document.getElementById('payload').textContent);
  const KEYSTORE = '__STORE__key';
  const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  const ub64 = u => btoa(String.fromCharCode(...new Uint8Array(u)));
  let KEY = null;

  async function derive(pw) {
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
    return crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b64(P.salt), iterations: P.iter, hash: 'SHA-256' }, base,
      { name: 'AES-GCM', length: 256 }, true, ['decrypt']);
  }
  async function dec(key, bytes) {
    return crypto.subtle.decrypt({ name: 'AES-GCM', iv: bytes.slice(0, 12) }, key, bytes.slice(12));
  }
  async function check(key) {
    try { return new TextDecoder().decode(await dec(key, b64(P.check))) === 'ebook-ok'; } catch { return false; }
  }
  async function open(key) {
    KEY = key;
    const html = new TextDecoder().decode(await dec(key, b64(P.data)));
    document.getElementById('gate').remove();
    document.body.insertAdjacentHTML('afterbegin', html);
    try { const p = JSON.parse(localStorage.getItem('__STORE__prefs') || '{}'); if (p.theme && p.theme !== 'light') document.documentElement.dataset.theme = p.theme; } catch {}
    const s = document.createElement('script'); s.src = 'ebook-assets/app/reader.js'; document.body.appendChild(s);
    const lock = document.createElement('button');
    lock.className = 'icon-btn hide-m'; lock.type = 'button'; lock.title = 'Khoá lại trên thiết bị này'; lock.textContent = '🔒';
    lock.onclick = () => { try { localStorage.removeItem(KEYSTORE); } catch {} location.reload(); };
    document.querySelector('.top-actions')?.appendChild(lock);
  }
  // tải PDF/EPUB: lấy bản mã hoá rồi giải mã ngay trên máy
  document.addEventListener('click', async e => {
    const a = e.target.closest('a[href^="downloads/"]');
    if (!a || !KEY) return;
    e.preventDefault();
    const name = a.getAttribute('href').split('/').pop();
    const t = document.getElementById('toast');
    const say = m => { if (t) { t.textContent = m; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 2200); } };
    say('Đang chuẩn bị ' + name + '…');
    try {
      const res = await fetch(a.getAttribute('href') + '.enc');
      if (!res.ok) throw new Error(res.status);
      const plain = await dec(KEY, new Uint8Array(await res.arrayBuffer()));
      const type = name.endsWith('.pdf') ? 'application/pdf' : 'application/epub+zip';
      const url = URL.createObjectURL(new Blob([plain], { type }));
      const dl = document.createElement('a'); dl.href = url; dl.download = name; document.body.appendChild(dl); dl.click(); dl.remove();
      setTimeout(() => URL.revokeObjectURL(url), 60000);
      say('Đã tải ' + name);
    } catch (err) { say('Không tải được, hãy thử lại'); }
  });

  const form = document.getElementById('gateForm'), pw = document.getElementById('pw'), err = document.getElementById('err'), go = document.getElementById('go');
  document.getElementById('eye').onclick = () => { pw.type = pw.type === 'password' ? 'text' : 'password'; pw.focus(); };
  form.addEventListener('submit', async e => {
    e.preventDefault();
    err.textContent = ''; go.disabled = true; go.textContent = 'Đang mở…';
    try {
      const key = await derive(pw.value.trim());
      if (!(await check(key))) throw new Error('bad');
      if (document.getElementById('remember').checked) {
        try { localStorage.setItem(KEYSTORE, ub64(await crypto.subtle.exportKey('raw', key))); } catch {}
      }
      await open(key);
    } catch {
      err.textContent = 'Mật khẩu chưa đúng. Kiểm tra lại chữ hoa, chữ thường.';
      form.classList.remove('shake'); void form.offsetWidth; form.classList.add('shake');
      go.disabled = false; go.textContent = 'Mở ebook →'; pw.select();
    }
  });
  (async () => {
    let raw = null; try { raw = localStorage.getItem(KEYSTORE); } catch {}
    if (!raw) return;
    try {
      const key = await crypto.subtle.importKey('raw', b64(raw), { name: 'AES-GCM' }, true, ['decrypt']);
      if (await check(key)) await open(key); else localStorage.removeItem(KEYSTORE);
    } catch { try { localStorage.removeItem(KEYSTORE); } catch {} }
  })();
})();
</script>
</body></html>
