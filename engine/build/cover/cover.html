<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../ebook-assets/app/fonts.css">
<style>
html,body{margin:0}
.c{width:1200px;height:1600px;box-sizing:border-box;padding:80px 90px 56px;position:relative;overflow:hidden;font-family:"Be Vietnam Pro";color:#fff;display:flex;flex-direction:column;gap:34px;
background:radial-gradient(700px 600px at 90% 8%,rgba(226,113,29,.55),transparent 70%),radial-gradient(900px 700px at 0% 100%,rgba(31,127,121,.6),transparent 70%),linear-gradient(160deg,#0b1d37,#12305a 55%,#0c2140)}
.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px);background-size:60px 60px}
.c>*:not(.grid){position:relative}
.top{display:flex;justify-content:space-between;font-size:22px;letter-spacing:.2em;text-transform:uppercase;opacity:.85;font-weight:600;margin-bottom:30px}
.tag{align-self:flex-start;padding:12px 24px;border-radius:40px;background:rgba(111,214,201,.18);color:#9fe8de;font-weight:800;font-size:22px;letter-spacing:.1em;text-transform:uppercase}
h1{margin:0 0 0 -6px;font-size:{{H1_SIZE}}px;line-height:.95;letter-spacing:-.04em;font-weight:800}
h1 span{display:block;font-size:72px;line-height:1.1;letter-spacing:-.03em;color:#ffb877;margin-top:18px}
.sub{max-width:950px;font-size:36px;line-height:1.4;opacity:.92}
.win{flex:1;min-height:300px;margin-top:10px;border-radius:28px;background:rgba(255,255,255,.08);border:2px solid rgba(255,255,255,.18);box-shadow:0 40px 80px rgba(0,0,0,.35);display:flex;flex-direction:column;gap:22px;padding:0 36px 34px}
.bar{height:56px;display:flex;gap:12px;align-items:center;margin:0 -36px;padding-left:26px;border-bottom:2px solid rgba(255,255,255,.12)}
.bar i{width:16px;height:16px;border-radius:50%;display:block}
.msg{max-width:620px;padding:20px 26px;border-radius:22px;font-size:26px;line-height:1.45}
.me{align-self:flex-end;background:#ffb877;color:#3a2410;font-weight:600;border-bottom-right-radius:6px}
.ai{align-self:flex-start;background:rgba(255,255,255,.95);color:#12305a;border-bottom-left-radius:6px}
.ai b{color:#1f7f79}
.flow{margin-top:auto;display:flex;gap:10px}
.flow div{flex:1;text-align:center;padding:14px 6px;border-radius:14px;background:rgba(111,214,201,.16);border:2px solid rgba(111,214,201,.35);font-size:19px;font-weight:700;color:#d6fbf5}
.pills{display:flex;flex-wrap:wrap;gap:14px}
.pills div{padding:12px 22px;border-radius:30px;border:2px solid rgba(255,255,255,.35);font-size:22px;font-weight:600}
.foot{display:flex;justify-content:space-between;font-size:22px;opacity:.75;border-top:2px solid rgba(255,255,255,.2);padding-top:22px}
.win:empty,.pills:empty{display:none}
</style></head><body><div class="c"><div class="grid"></div>
<div class="top"><span>{{ORG}}</span><span>{{TAGLINE}}</span></div>
<div class="tag">{{TAG}}</div>
<h1>{{TITLE}}<span>{{TITLE2}}</span></h1>
<div class="sub">{{SUB}}</div>
<div class="win"><div class="bar"><i style="background:#ff5f57"></i><i style="background:#febc2e"></i><i style="background:#28c840"></i></div>
<div class="msg me">{{Q}}</div>
<div class="msg ai"><b>{{A_WHO}}:</b> {{A}}</div>
<div class="flow">{{FLOW}}</div></div>
<div class="pills">{{PILLS}}</div>
<div class="foot"><span>{{AUTHOR}}</span><span>{{YEAR}}</span></div>
</div></body></html>
